<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Աշխարհի ժամացույց և նորություններ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #2c3e50; padding: 20px; }
    .container { max-width: 900px; margin: auto; }
    h1 { text-align: center; margin-bottom: 20px; }
    select { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
    .box { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .clock { font-size: 48px; font-weight: bold; text-align: center; }
    .date { text-align: center; color: #7f8c8d; margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    .plus { color: #27ae60; font-weight: bold; }
    .minus { color: #c0392b; font-weight: bold; }
    .news-item { padding: 12px 0; border-bottom: 1px solid #eee; }
    .news-item a { color: #2980b9; text-decoration: none; font-weight: bold; }
    .news-item small { color: #95a5a6; display: block; margin-top: 4px; }
    .note { color: #7f8c8d; font-size: 14px; }
  </style>
</head>
<body>
<div class="container">
  <h1>🌍 Աշխարհի ժամացույց և նորություններ</h1>

  <select id="country"></select>

  <div class="box">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div class="box">
    <h2>Ժամային տարբերությունը այլ երկրների հետ</h2>
    <table>
      <thead>
        <tr><th>Երկիր</th><th>Տեղային ժամ</th><th>Տարբերություն</th></tr>
      </thead>
      <tbody id="diffTable"></tbody>
    </table>
  </div>

  <div class="box">
    <h2>Վերջին նորությունները</h2>
    <div id="news"><p class="note">Բեռնվում է...</p></div>
  </div>
</div>

<script>
  // ⚠️ Նորությունների համար անվճար բանալի ստացիր https://gnews.io կայքից
  // և տեղադրիր այստեղ՝ չակերտների մեջ
  const NEWS_API_KEY = "";

  const countries = [
    { name: "Հայաստան",   code: "am", tz: "Asia/Yerevan" },
    { name: "Վրաստան",    code: "ge", tz: "Asia/Tbilisi" },
    { name: "Ռուսաստան",  code: "ru", tz: "Europe/Moscow" },
    { name: "Թուրքիա",    code: "tr", tz: "Europe/Istanbul" },
    { name: "Իրան",       code: "ir", tz: "Asia/Tehran" },
    { name: "ԱՄԷ",        code: "ae", tz: "Asia/Dubai" },
    { name: "Ֆրանսիա",    code: "fr", tz: "Europe/Paris" },
    { name: "Գերմանիա",   code: "de", tz: "Europe/Berlin" },
    { name: "Իտալիա",     code: "it", tz: "Europe/Rome" },
    { name: "Իսպանիա",    code: "es", tz: "Europe/Madrid" },
    { name: "Մեծ Բրիտանիա", code: "gb", tz: "Europe/London" },
    { name: "ԱՄՆ (Նյու Յորք)", code: "us", tz: "America/New_York" },
    { name: "Կանադա",     code: "ca", tz: "America/Toronto" },
    { name: "Բրազիլիա",   code: "br", tz: "America/Sao_Paulo" },
    { name: "Հնդկաստան",  code: "in", tz: "Asia/Kolkata" },
    { name: "Չինաստան",   code: "cn", tz: "Asia/Shanghai" },
    { name: "Ճապոնիա",    code: "jp", tz: "Asia/Tokyo" },
    { name: "Ավստրալիա",  code: "au", tz: "Australia/Sydney" }
  ];

  const select = document.getElementById("country");
  countries.forEach((c, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = c.name;
    select.appendChild(opt);
  });

  // Վերադարձնում է ժամային գոտու շեղումը UTC-ից րոպեներով
  function getOffset(tz, date) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    }).formatToParts(date);
    const v = {};
    parts.forEach(p => v[p.type] = p.value);
    const hour = v.hour === "24" ? 0 : +v.hour;
    const asUTC = Date.UTC(v.year, v.month - 1, v.day, hour, v.minute, v.second);
    return Math.round((asUTC - date.getTime()) / 60000);
  }

  function formatDiff(minutes) {
    if (minutes === 0) return "<span>Նույն ժամը</span>";
    const sign = minutes > 0 ? "+" : "−";
    const abs = Math.abs(minutes);
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    const text = m ? `${sign}${h} ժ ${m} ր` : `${sign}${h} ժ`;
    return `<span class="${minutes > 0 ? "plus" : "minus"}">${text}</span>`;
  }

  function update() {
    const now = new Date();
    const current = countries[select.value];

    document.getElementById("clock").textContent =
      now.toLocaleTimeString("en-GB", { timeZone: current.tz });
    document.getElementById("date").textContent =
      now.toLocaleDateString("hy-AM", {
        timeZone: current.tz, weekday: "long",
        year: "numeric", month: "long", day: "numeric"
      });

    const baseOffset = getOffset(current.tz, now);
    let rows = "";
    countries.forEach(c => {
      if (c === current) return;
      const diff = getOffset(c.tz, now) - baseOffset;
      const time = now.toLocaleTimeString("en-GB", {
        timeZone: c.tz, hour: "2-digit", minute: "2-digit"
      });
      rows += `<tr><td>${c.name}</td><td>${time}</td><td>${formatDiff(diff)}</td></tr>`;
    });
    document.getElementById("diffTable").innerHTML = rows;
  }

  async function loadNews() {
    const box = document.getElementById("news");
    const current = countries[select.value];

    if (!NEWS_API_KEY) {
      box.innerHTML = '<p class="note">Նորությունները ցուցադրելու համար կոդի սկզբում լրացրու NEWS_API_KEY-ը (անվճար բանալի՝ gnews.io-ից)։</p>';
      return;
    }

    box.innerHTML = '<p class="note">Բեռնվում է...</p>';
    try {
      const url = `https://gnews.io/api/v4/top-headlines?country=${current.code}&max=6&apikey=${NEWS_API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!data.articles || data.articles.length === 0) {
        box.innerHTML = '<p class="note">Այս երկրի համար նորություններ չգտնվեցին։</p>';
        return;
      }

      box.innerHTML = data.articles.map(a => `
        <div class="news-item">
          <a href="${a.url}" target="_blank" rel="noopener">${a.title}</a>
          <small>${a.source.name} · ${new Date(a.publishedAt).toLocaleString("hy-AM")}</small>
        </div>
      `).join("");
    } catch (e) {
      box.innerHTML = '<p class="note">Չհաջողվեց բեռնել նորությունները։</p>';
    }
  }

  select.addEventListener("change", () => { update(); loadNews(); });

  update();
  loadNews();
  setInterval(update, 1000);
</script>
</body>
</html>
